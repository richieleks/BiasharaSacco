kind = "web"
previewPath = "/"
title = "Biashara SACCO"
version = "1.0.0"
id = "artifacts/biashara-sacco"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24523

[services.development]
run = "pnpm --filter @workspace/biashara-sacco run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/biashara-sacco", "run", "build" ]
publicDir = "artifacts/biashara-sacco/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24523"
BASE_PATH = "/"
